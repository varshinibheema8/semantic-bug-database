
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Bug | Semantic Bug Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="form-header">
        <div class="form-header-content">
            <h1>Semantic Bug Tracker</h1>
            <p>Report and manage software bugs</p>
        </div>
    </header>

    <main class="add-bug-container">

        <div class="add-bug-card">

            <div class="form-heading">
                <h2>Add New Bug</h2>
                <p>Enter the details of the software issue below.</p>
            </div>

            <form method="POST" action="{{ url_for('save_bug') }}">

                <div class="bug-form-grid">

                    <div class="form-group full-width">
                        <label for="title">Bug Title *</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter bug title"
                            maxlength="300"
                            required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            rows="4"
                            placeholder="Describe the bug, its symptoms and steps to reproduce it..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="project_id">Project *</label>
                        <select id="project_id" name="project_id" required>
                            <option value="">Select Project</option>
                            {% for project in projects %}
                                <option value="{{ project[0] }}">
                                    {{ project[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="developer_id">Developer *</label>
                        <select id="developer_id" name="developer_id" required>
                            <option value="">Select Developer</option>
                            {% for developer in developers %}
                                <option value="{{ developer[0] }}">
                                    {{ developer[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="module_id">Module *</label>
                        <select id="module_id" name="module_id" required>
                            <option value="">Select Module</option>
                            {% for module in modules %}
                                <option value="{{ module[0] }}">
                                    {{ module[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cause_id">Root Cause</label>
                        <select id="cause_id" name="cause_id">
                            <option value="">Select Root Cause (Optional)</option>
                            {% for cause in causes %}
                                <option value="{{ cause[0] }}">
                                    {{ cause[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severity">Severity</label>
                        <select id="severity" name="severity">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="visibility">Bug Visibility</label>
                        <select id="visibility" name="visibility" required>
                            <option value="private">Private</option>
                            <option value="shared">Shared</option>
                        </select>
                        <small>
                            Private bugs are visible only to their creator.
                            Shared bugs are visible to project members.
                        </small>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="save-bug-button">
                        Save Bug
                    </button>

                    <a href="{{ url_for('home') }}"
                       class="back-dashboard-button">
                        Back to Dashboard
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
